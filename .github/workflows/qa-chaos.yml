name: QA Chaos Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ada_oil_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix src/backend ci

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL and seed database
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done
          mysql -h127.0.0.1 -uroot -proot ada_oil_test < QA/ci/schema.sql
          mysql -h127.0.0.1 -uroot -proot ada_oil_test < QA/ci/seed.sql

      - name: Build frontend assets
        run: npm run build

      - name: Start backend server
        env:
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: ada_oil_test
          DISABLE_WELLSTOP_SCHEDULER: 1
        run: |
          mkdir -p QA/test-reports
          nohup npm run backend:start > QA/test-reports/backend.log 2>&1 &

      - name: Wait for backend readiness
        run: |
          for i in {1..60}; do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health

      - name: Run chaos tests
        env:
          CHAOS_BASE_URL: http://localhost:3000
        run: npm run chaos:test

      - name: Upload chaos artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: QA/test-reports/chaos
          if-no-files-found: warn
