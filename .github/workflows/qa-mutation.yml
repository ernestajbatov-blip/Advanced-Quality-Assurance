name: QA Mutation Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stryker + @stryker-mutator/vitest-runner v9 are not yet compatible with
      # Node.js 24's stricter ESM loader. Node 20 has issues spawning Vitest's
      # worker threads with Stryker's instrumentation. Node 22 (LTS) works perfectly.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install



      - name: Run mutation tests (Stryker)
        env:
          CI: true
          PW_NO_WEBSERVER: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run mutation:test

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: QA/test-reports/mutation
          if-no-files-found: warn
