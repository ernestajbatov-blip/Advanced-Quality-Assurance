name: QA Mutation Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stryker + @stryker-mutator/vitest-runner v9 are not yet compatible with
      # Node.js 24's stricter ESM loader. Node 20 has issues spawning Vitest's
      # worker threads with Stryker's instrumentation. Node 22 (LTS) works perfectly.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Ensure Stryker plugins are installed
        # The resolved entries for Stryker packages are missing from package-lock.json
        # because they were originally installed via yarn. Force-install them so the
        # plugin loader can find @stryker-mutator/vitest-runner at runtime.
        run: npm install --no-save @stryker-mutator/vitest-runner@9.6.1 @stryker-mutator/core@9.6.1 @stryker-mutator/api@9.6.1

      - name: Patch Stryker Vitest Runner to use forks correctly
        # Node's worker threads + dynamic ESM injection is notoriously unstable in 
        # Linux CI environments. We patch the source code directly to use 'forks',
        # taking care to rename poolOptions so that Vitest tinypool initializes.
        run: |
          sed -i "s/pool: 'threads'/pool: 'forks'/g" node_modules/@stryker-mutator/vitest-runner/dist/src/vitest-test-runner.js
          sed -i "s/threads: {/forks: {/g" node_modules/@stryker-mutator/vitest-runner/dist/src/vitest-test-runner.js
          sed -i "s/maxThreads: 1/maxForks: 1/g" node_modules/@stryker-mutator/vitest-runner/dist/src/vitest-test-runner.js
          sed -i "s/minThreads: 1/minForks: 1/g" node_modules/@stryker-mutator/vitest-runner/dist/src/vitest-test-runner.js

      - name: Run mutation tests (Stryker)
        env:
          CI: true
          PW_NO_WEBSERVER: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run mutation:test

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: QA/test-reports/mutation
          if-no-files-found: warn
